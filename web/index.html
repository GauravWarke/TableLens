<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TableLens</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:960px;padding:24px;background:#142e32;color:#f6f5ee;font:17px/1.45 system-ui}h1{margin-bottom:0}h2{font-size:1.25rem}section{padding:18px;margin:14px 0;background:#234246;border-radius:12px}button,input,.file{font:inherit;border:0;border-radius:7px;padding:9px;margin:3px;background:white;color:#142e32}.file{display:inline-block;cursor:pointer}.file input{display:block;max-width:100%;font-size:14px}button{cursor:pointer}button:disabled{opacity:.55}canvas{display:block;width:auto;max-width:100%;max-height:340px;margin:12px auto}canvas[hidden]{display:none}li{padding:4px}output{display:block;margin:8px}p{margin:.5em 0}</style>
<h1>TableLens</h1><p>Find an item and check it off as you pack.</p>
<section><h2>Scan the table</h2><label class="file">Choose a photo or video<input id="file" type="file" accept="image/*,video/*"></label><button id="camera">Start camera</button><button id="stop">Stop scanning</button><output id="status" aria-live="polite">Choose an input to load the detector.</output><video muted playsinline hidden></video><canvas id="view" hidden></canvas><output id="counts"></output></section>
<section><h2>Find &amp; pack up</h2><label>Item <input id="query" value="mouse" placeholder="e.g. phone"></label><button id="find">Find</button><button id="add">Add to checklist</button><output id="found" aria-live="polite"></output><canvas id="last" hidden></canvas><ul id="list"></ul></section>
<section><h2>Compare scans</h2><button id="before" disabled>Set before</button><button id="after" disabled>Set after</button><output id="diff">Save two scans to compare counts.</output></section>
<script type="module" src="app.mjs"></script></html>
