name: TableLens
options:
  deploymentTarget:
    visionOS: "2.0"
targets:
  TableLens:
    type: application
    platform: visionOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
        excludes: ["*.mlmodel"]
      - path: Resources/TableObjects.mlmodel
        buildPhase: sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TableLens
        NSWorldSensingUsageDescription: Recognise and label your enrolled tabletop objects in physical space.
        NSMainCameraUsageDescription: Identify tabletop objects locally from the headset cameras.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.tablelens.prototype
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
schemes:
  TableLens:
    build:
      targets:
        TableLens: all
